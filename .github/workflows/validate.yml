name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax and unit tests (no infrastructure changes)
        run: bash tests/unit.sh
      - name: Build standalone and ZIP
        run: python3 tools/package.py
      - name: Check standalone syntax
        run: bash -n dist/bootstrap-sucacenter.sh
      - name: Install Ansible validation dependencies
        run: |
          python3 -m pip install ansible-core
          ansible-galaxy collection install ansible.posix
      - name: Ansible syntax (no remote connections)
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/site.yml --syntax-check
          ansible-playbook -i ansible/inventory.ini ansible/replication.yml --syntax-check
          ansible-playbook -i ansible/inventory.ini ansible/replication-status.yml --syntax-check
